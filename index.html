<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personal TV Dashboard</title>
  <style>
    body { 
      background-color: #141414; 
      color: #fff; 
      font-family: sans-serif; 
      margin: 0; 
      padding: 0; 
      overflow-x: hidden; 
    }

    /* Netflix Hero Banner (Wide Cinematic Thumbnail) */
    .hero-banner {
      position: relative;
      width: 100%;
      height: 65vh; /* Large top banner area */
      /* Background image setup for wide 16:9 cinematic look */
      background: linear-gradient(to top, #141414 5%, rgba(20,20,20,0.4) 50%, transparent 100%),
                  linear-gradient(to right, rgba(0,0,0,0.9) 30%, rgba(0,0,0,0.2) 70%),
                  url('https://upload.wikimedia.org/wikipedia/commons/c/c5/Big_buck_bunny_poster_big.bjp.jpg') no-repeat center center / cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 50px;
      box-sizing: border-box;
      border: 4px solid transparent;
      transition: border-color 0.2s;
    }

    /* Focused state for Hero Banner when using TV Remote */
    .hero-banner.focused {
      border-color: #e50914;
      outline: none;
    }
    
    .hero-title {
      font-size: 3.5rem;
      margin: 0 0 10px 0;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
    }

    .hero-desc {
      font-size: 1.1rem;
      color: #ddd;
      max-width: 500px;
      margin-bottom: 25px;
      line-height: 1.4;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
    }

    .hero-buttons {
      display: flex;
      gap: 15px;
    }

    .hero-btn {
      padding: 12px 28px;
      border-radius: 4px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      border: 3px solid transparent;
      background-color: rgba(100, 100, 100, 0.7);
      color: white;
      transition: all 0.2s;
    }

    .hero-btn-play {
      background-color: #fff;
      color: #000;
    }

    .hero-btn.focused {
      border-color: #e50914;
      transform: scale(1.08);
      outline: none;
      box-shadow: 0 0 15px rgba(229, 9, 20, 0.8);
    }

    /* Main Grid Area Below Hero */
    .content-section {
      margin-top: -20px;
      position: relative;
      z-index: 2;
    }

    h2 { 
      margin-left: 50px; 
      font-size: 1.4rem;
      margin-bottom: 10px;
    }

    /* Scrollable Row Styling for Normal Vertical Posters */
    .grid { 
      display: flex; 
      gap: 15px; 
      padding: 10px 50px 30px 50px; 
      overflow-x: auto; 
      scroll-behavior: smooth;
      scrollbar-width: none; 
    }
    .grid::-webkit-scrollbar {
      display: none; 
    }

    /* Normal Vertical Poster Cards */
    .card {
      min-width: 180px; 
      width: 180px; 
      height: 260px; /* Normal portrait height */
      background-color: #333; 
      border-radius: 8px;
      border: 4px solid transparent; 
      transition: transform 0.2s, border-color 0.2s;
      flex-shrink: 0; 
      overflow: hidden; 
      cursor: pointer;
    }
    .card.focused { 
      border-color: #e50914; 
      transform: scale(1.08); 
      outline: none; 
      z-index: 5;
    }

    /* Details Sidebar Overlay */
    .details-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to right, rgba(0,0,0,0.95) 35%, rgba(0,0,0,0.4) 100%);
      display: none; flex-direction: column; justify-content: center;
      padding-left: 50px; box-sizing: border-box; z-index: 10;
    }
    .details-content { max-width: 400px; }
    .details-title { font-size: 2.5rem; margin-bottom: 10px; }
    .details-description { font-size: 1rem; color: #ccc; margin-bottom: 20px; line-height: 1.4; }
    
    .action-btn {
      display: block; width: 200px; padding: 12px 20px; margin-bottom: 10px;
      background-color: #333; color: white; border: 2px solid transparent;
      border-radius: 4px; font-size: 1.1rem; font-weight: bold; text-align: center;
    }
