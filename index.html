<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personal TV Dashboard</title>
  <style>
    body { background-color: #141414; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; overflow: hidden; }
    h2 { margin-left: 10px; }
    .grid { display: flex; gap: 15px; padding: 10px; }
    .card {
      width: 180px; height: 260px; background-color: #333; border-radius: 8px;
      border: 4px solid transparent; transition: transform 0.2s, border-color 0.2s;
      overflow: hidden; cursor: pointer;
    }
    .card.focused { border-color: #e50914; transform: scale(1.08); outline: none; }

    /* Netflix-style Details Sidebar Overlay */
    .details-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to right, rgba(0,0,0,0.95) 35%, rgba(0,0,0,0.4) 100%);
      display: none; flex-direction: column; justify-content: center;
      padding-left: 50px; box-sizing: border-box; z-index: 10;
    }
    .details-content { max-width: 400px; }
    .details-title { font-size: 2.5rem; margin-bottom: 10px; }
    .details-description { font-size: 1rem; color: #ccc; margin-bottom: 20px; line-height: 1.4; }
    
    .action-btn {
      display: block; width: 200px; padding: 12px 20px; margin-bottom: 10px;
      background-color: #333; color: white; border: 2px solid transparent;
      border-radius: 4px; font-size: 1.1rem; font-weight: bold; text-align: center;
    }
    .action-btn.focused { border-color: #e50914; background-color: #e50914; outline: none; }

    /* Fullscreen In-Page Player */
    .player-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #000; display: none; z-index: 20;
    }
    video { width: 100%; height: 100%; object-fit: contain; }

    /* Video Player Overlay Controls */
    .player-controls {
      position: absolute; bottom: 0; left: 0; right: 0; top: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 40%, rgba(0,0,0,0.6) 100%);
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 30px 50px; box-sizing: border-box; opacity: 0; transition: opacity 0.3s;
      z-index: 25; pointer-events: none;
    }
    .player-controls.visible { opacity: 1; pointer-events: auto; }

    .top-controls { display: flex; justify-content: flex-start; }
    .control-btn {
      background-color: rgba(40, 40, 40, 0.8); color: white; border: 2px solid transparent;
      padding: 10px 20px; border-radius: 4px; font-size: 1rem; font-weight: bold;
      cursor: pointer; margin-right: 10px;
    }
    .control-btn.focused { border-color: #e50914; background-color: #e50914; }

    .bottom-controls { display: flex; flex-direction: column; gap: 15px; }
    
    /* Netflix Red Progress Bar */
    .progress-container {
      width: 100%; height: 8px; background-color: rgba(255, 255, 255, 0.3);
      border-radius: 4px; overflow: hidden; position: relative;
    }
    .progress-bar { width: 0%; height: 100%; background-color: #e50914; transition: width 0.2s linear; }

    .control-buttons-row { display: flex; align-items: center; gap: 15px; }
  </style>
</head>
<body>

  <h2>Trending Shows</h2>
  <div class="grid" id="movieGrid">
    <div class="card focused" tabindex="0" 
         data-title="Big Buck Bunny" 
         data-desc="A giant rabbit with a heart of gold deals with forest bullies."
         data-video="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4">
      <img src="https://upload.wikimedia.org/wikipedia/commons/c/c5/Big_buck_bunny_poster_big.bjp.jpg" style="width:100%; height:100%; object-fit:cover;">
    </div>
    
    <div class="card" tabindex="0" 
         data-title="Elephant's Dream" 
         data-desc="Two friends explore a strange machine-driven world."
         data-video="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4">
      <img src="https://upload.wikimedia.org/wikipedia/commons/e/e8/Elephants_Dream_poster.jpg" style="width:100%; height:100%; object-fit:cover;">
    </div>
  </div>

  <!-- Left Sidebar Details Screen -->
  <div class="details-overlay" id="detailsScreen">
    <div class="details-content">
      <h1 class="details-title" id="showTitle">Movie Title</h1>
      <p class="details-description" id="showDesc">Movie description goes here.</p>
      <div class="action-btn focused" id="btnPlay" tabindex="0">► Play</div>
      <div class="action-btn" id="btnBack" tabindex="0">Back</div>
    </div>
  </div>

  <!-- In-Site Fullscreen Player -->
  <div class="player-overlay" id="playerScreen">
    <video id="videoPlayer"></video>
    
    <!-- Player Overlay Controls -->
    <div class="player-controls" id="playerControls">
      <div class="top-controls">
        <div class="control-btn focused" id="pBtnHome">← Home Screen</div>
      </div>
      
      <div class="bottom-controls">
        <div class="progress-container">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="control-buttons-row">
          <div class="control-btn" id="pBtnRw">« 10s</div>
          <div class="control-btn" id="pBtnPlayPause">❚❚ Pause</div>
          <div class="control-btn" id="pBtnFf">10s »</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const cards = Array.from(document.querySelectorAll('.card'));
    const detailsScreen = document.getElementById('detailsScreen');
    const playerScreen = document.getElementById('playerScreen');
    const playerControls = document.getElementById('playerControls');
    const videoPlayer = document.getElementById('videoPlayer');
    const progressBar = document.getElementById('progressBar');

    const detailBtns = [document.getElementById('btnPlay'), document.getElementById('btnBack')];
    const playerBtns = [
      document.getElementById('pBtnHome'),
      document.getElementById('pBtnRw'),
      document.getElementById('pBtnPlayPause'),
      document.getElementById('pBtnFf')
    ];

    let currentCardIndex = 0;
    let currentDetailBtnIndex = 0;
    let currentPlayerBtnIndex = 0;
    let activeMode = 'GRID'; // 'GRID', 'DETAILS', or 'PLAYER'
    let selectedVideoUrl = '';
    let controlsTimeout = null;

    function updateCardFocus(newIndex) {
      if (newIndex >= 0 && newIndex < cards.length) {
        cards[currentCardIndex].classList.remove('focused');
        currentCardIndex = newIndex;
        cards[currentCardIndex].classList.add('focused');
      }
    }

    function updateDetailBtnFocus(newIndex) {
      if (newIndex >= 0 && newIndex < detailBtns.length) {
        detailBtns[currentDetailBtnIndex].classList.remove('focused');
        currentDetailBtnIndex = newIndex;
        detailBtns[currentDetailBtnIndex].classList.add('focused');
      }
    }

    function updatePlayerBtnFocus(newIndex) {
      if (newIndex >= 0 && newIndex < playerBtns.length) {
        playerBtns[currentPlayerBtnIndex].classList.remove('focused');
        currentPlayerBtnIndex = newIndex;
        playerBtns[currentPlayerBtnIndex].classList.add('focused');
      }
    }

    function showPlayerControls() {
      playerControls.classList.add('visible');
      clearTimeout(controlsTimeout);
      controlsTimeout = setTimeout(() => {
        playerControls.classList.remove('visible');
      }, 4000);
    }

    function openDetails() {
      const card = cards[currentCardIndex];
      document.getElementById('showTitle').innerText = card.getAttribute('data-title');
      document.getElementById('showDesc').innerText = card.getAttribute('data-desc');
      selectedVideoUrl = card.getAttribute('data-video');
      
      activeMode = 'DETAILS';
      detailsScreen.style.display = 'flex';
      updateDetailBtnFocus(0);
    }

    function closeDetails() {
      activeMode = 'GRID';
      detailsScreen.style.display = 'none';
    }

    function startPlayback() {
      activeMode = 'PLAYER';
      playerScreen.style.display = 'block';
      videoPlayer.src = selectedVideoUrl;
      videoPlayer.play();
      updatePlayerBtnFocus(0);
      showPlayerControls();
    }

    function stopPlayback() {
      videoPlayer.pause();
      videoPlayer.src = '';
      playerScreen.style.display = 'none';
      detailsScreen.style.display = 'none';
      activeMode = 'GRID';
      clearTimeout(controlsTimeout);
    }

    // Update Progress Bar
    videoPlayer.addEventListener('timeupdate', () => {
      if (videoPlayer.duration) {
        const percent = (videoPlayer.currentTime / videoPlayer.duration) * 100;
        progressBar.style.width = percent + '%';
      }
    });

    // Remote Control Handling
    document.addEventListener('keydown', (e) => {
      if (activeMode === 'GRID') {
        if (e.key === 'ArrowRight') updateCardFocus(currentCardIndex + 1);
        if (e.key === 'ArrowLeft') updateCardFocus(currentCardIndex - 1);
        if (e.key === 'Enter') openDetails();
      } 
      else if (activeMode === 'DETAILS') {
        if (e.key === 'ArrowDown') updateDetailBtnFocus(1);
        if (e.key === 'ArrowUp') updateDetailBtnFocus(0);
        if (e.key === 'Escape' || e.key === 'Backspace') closeDetails();
        if (e.key === 'Enter') {
          if (currentDetailBtnIndex === 0) startPlayback();
          if (currentDetailBtnIndex === 1) closeDetails();
        }
      } 
      else if (activeMode === 'PLAYER') {
        // If controls are hidden, any button press wakes them up first
        if (!playerControls.classList.contains('visible')) {
          showPlayerControls();
          return;
        }

        showPlayerControls(); // Reset auto-hide timer on key press

        if (e.key === 'ArrowDown') {
          if (currentPlayerBtnIndex === 0) updatePlayerBtnFocus(2); // Jump to Play/Pause
        }
        if (e.key === 'ArrowUp') {
          if (currentPlayerBtnIndex > 0) updatePlayerBtnFocus(0); // Jump to Home Screen
        }
        if (e.key === 'ArrowRight') {
          if (currentPlayerBtnIndex > 0 && currentPlayerBtnIndex < 3) updatePlayerBtnFocus(currentPlayerBtnIndex + 1);
        }
        if (e.key === 'ArrowLeft') {
          if (currentPlayerBtnIndex > 1) updatePlayerBtnFocus(currentPlayerBtnIndex - 1);
        }

        if (e.key === 'Escape' || e.key === 'Backspace') {
          stopPlayback();
        }

        if (e.key === 'Enter') {
          if (currentPlayerBtnIndex === 0) stopPlayback(); // Return to Home
          if (currentPlayerBtnIndex === 1) videoPlayer.currentTime -= 10; // Rewind 10s
          if (currentPlayerBtnIndex === 2) { // Play/Pause toggle
            if (videoPlayer.paused) {
              videoPlayer.play();
              document.getElementById('pBtnPlayPause').innerText = '❚❚ Pause';
            } else {
              videoPlayer.pause();
              document.getElementById('pBtnPlayPause').innerText = '► Play';
            }
          }
          if (currentPlayerBtnIndex === 3) videoPlayer.currentTime += 10; // Fast Forward 10s
        }
      }
    });
  </script>
</body>
</html>
