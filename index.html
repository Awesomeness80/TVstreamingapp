<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personal TV Dashboard</title>
  <style>
    body { 
      background-color: #141414; 
      color: #fff; 
      font-family: sans-serif; 
      margin: 0; 
      padding: 0; 
      overflow-x: hidden; 
    }

    /* Netflix Hero Banner (Wide Cinematic Backdrop) */
    .hero-banner {
      position: relative;
      width: 100%;
      height: 65vh;
      background: linear-gradient(to top, #141414 5%, rgba(20,20,20,0.4) 50%, transparent 100%),
                  linear-gradient(to right, rgba(0,0,0,0.9) 30%, rgba(0,0,0,0.2) 70%),
                  url('https://www.bostonherald.com/wp-content/uploads/2026/06/BHR-Z-TOY-01.jpg?w=1569') no-repeat center center / cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 50px;
      box-sizing: border-box;
      border: 4px solid transparent;
      transition: border-color 0.2s;
    }

    .hero-banner.focused {
      border-color: #e50914;
      outline: none;
    }
    
    .hero-title {
      font-size: 3.5rem;
      margin: 0 0 10px 0;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
    }

    .hero-desc {
      font-size: 1.1rem;
      color: #ddd;
      max-width: 500px;
      margin-bottom: 25px;
      line-height: 1.4;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
    }

    .hero-buttons {
      display: flex;
      gap: 15px;
    }

    .hero-btn {
      padding: 12px 28px;
      border-radius: 4px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      border: 3px solid transparent;
      background-color: rgba(100, 100, 100, 0.7);
      color: white;
      transition: all 0.2s;
    }

    .hero-btn-play { background-color: #fff; color: #000; }

    .hero-btn.focused {
      border-color: #e50914;
      transform: scale(1.08);
      outline: none;
      box-shadow: 0 0 15px rgba(229, 9, 20, 0.8);
    }

    /* Main Rows Section */
    .content-section {
      margin-top: -20px;
      position: relative;
      z-index: 2;
    }

    .row-title { 
      margin-left: 50px; 
      font-size: 1.4rem;
      margin-top: 25px;
      margin-bottom: 10px;
    }

    /* Scrollable Row Styling */
    .grid { 
      display: flex; 
      gap: 15px; 
      padding: 10px 50px; 
      overflow-x: auto; 
      scroll-behavior: smooth;
      scrollbar-width: none; 
    }
    .grid::-webkit-scrollbar { display: none; }

    /* Vertical Poster Cards (10 per row) */
    .card {
      min-width: 180px; 
      width: 180px; 
      height: 260px; 
      background-color: #333; 
      border-radius: 8px;
      border: 4px solid transparent; 
      transition: transform 0.2s, border-color 0.2s;
      flex-shrink: 0; 
      overflow: hidden; 
      cursor: pointer;
    }
    .card.focused { 
      border-color: #e50914; 
      transform: scale(1.08); 
      outline: none; 
      z-index: 5;
    }

    /* Details Sidebar Overlay */
    .details-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to right, rgba(0,0,0,0.95) 35%, rgba(0,0,0,0.4) 100%);
      display: none; flex-direction: column; justify-content: center;
      padding-left: 50px; box-sizing: border-box; z-index: 10;
    }
    .details-content { max-width: 400px; }
    .details-title { font-size: 2.5rem; margin-bottom: 10px; }
    .details-description { font-size: 1rem; color: #ccc; margin-bottom: 20px; line-height: 1.4; }
    
    .action-btn {
      display: block; width: 200px; padding: 12px 20px; margin-bottom: 10px;
      background-color: #333; color: white; border: 2px solid transparent;
      border-radius: 4px; font-size: 1.1rem; font-weight: bold; text-align: center;
    }
    .action-btn.focused { border-color: #e50914; background-color: #e50914; outline: none; }

    /* Fullscreen In-Page Player */
    .player-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #000; display: none; z-index: 20;
    }
    video { width: 100%; height: 100%; object-fit: contain; }

    /* Video Player Overlay Controls */
    .player-controls {
      position: absolute; bottom: 0; left: 0; right: 0; top: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 40%, rgba(0,0,0,0.6) 100%);
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 30px 50px; box-sizing: border-box; opacity: 0; transition: opacity 0.3s;
      z-index: 25; pointer-events: none;
    }
    .player-controls.visible { opacity: 1; pointer-events: auto; }

    .top-controls { display: flex; justify-content: flex-start; }
    .control-btn {
      background-color: rgba(40, 40, 40, 0.8); color: white; border: 2px solid transparent;
      padding: 10px 20px; border-radius: 4px; font-size: 1rem; font-weight: bold;
      cursor: pointer; margin-right: 10px;
    }
    .control-btn.focused { border-color: #e50914; background-color: #e50914; }

    .bottom-controls { display: flex; flex-direction: column; gap: 15px; }
    .progress-container {
      width: 100%; height: 8px; background-color: rgba(255, 255, 255, 0.3);
      border-radius: 4px; overflow: hidden; position: relative;
    }
    .progress-bar { width: 0%; height: 100%; background-color: #e50914; transition: width 0.2s linear; }
    .control-buttons-row { display: flex; align-items: center; gap: 15px; }
  </style>
</head>
<body>

  <!-- Left Sidebar Details Screen -->
  <div class="details-overlay" id="detailsScreen">
    <div class="details-content">
      <h1 class="details-title" id="showTitle">Movie Title</h1>
      <p class="details-description" id="showDesc">Movie description goes here.</p>
      <div class="action-btn focused" id="btnPlay" tabindex="0">► Play</div>
      <div class="action-btn" id="btnBack" tabindex="0">Back</div>
    </div>
  </div>

  <!-- In-Site Fullscreen Player -->
  <div class="player-overlay" id="playerScreen">
    <video id="videoPlayer"></video>
    <div class="player-controls" id="playerControls">
      <div class="top-controls">
        <div class="control-btn focused" id="pBtnHome">← Home Screen</div>
      </div>
      <div class="bottom-controls">
        <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
        <div class="control-buttons-row">
          <div class="control-btn" id="pBtnRw">« 10s</div>
          <div class="control-btn" id="pBtnPlayPause">❚❚ Pause</div>
          <div class="control-btn" id="pBtnFf">10s »</div>
        </div>
      </div>

  <script>
    const rows = Array.from(document.querySelectorAll('.grid'));
    const heroBtns = [document.getElementById('heroBtnPlay'), document.getElementById('heroBtnInfo')];
    const detailsScreen = document.getElementById('detailsScreen');
    const playerScreen = document.getElementById('playerScreen');
    const playerControls = document.getElementById('playerControls');
    const videoPlayer = document.getElementById('videoPlayer');
    const progressBar = document.getElementById('progressBar');

    const detailBtns = [document.getElementById('btnPlay'), document.getElementById('btnBack')];
    const playerBtns = [
      document.getElementById('pBtnHome'),
      document.getElementById('pBtnRw'),
      document.getElementById('pBtnPlayPause'),
      document.getElementById('pBtnFf')
    ];

    let activeZone = 'HERO'; // 'HERO', 'GRID', 'DETAILS', 'PLAYER'
    let currentHeroBtnIndex = 0;
    let currentRowIndex = 0;
    let currentCardIndex = 0;
    let currentDetailBtnIndex = 0;
    let currentPlayerBtnIndex = 0;
    
    let featuredVideoUrl = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4";
    let selectedVideoUrl = "";
    let controlsTimeout = null;

    function getCardsInCurrentRow() {
      return Array.from(rows[currentRowIndex].querySelectorAll('.card'));
    }

    function updateHeroBtnFocus(newIndex) {
      if (newIndex >= 0 && newIndex < heroBtns.length) {
        heroBtns[currentHeroBtnIndex].classList.remove('focused');
        currentHeroBtnIndex = newIndex;
        heroBtns[currentHeroBtnIndex].classList.add('focused');
      }
    }

    function updateCardFocus(newRowIndex, newCardIndex) {
      const currentCards = getCardsInCurrentRow();
      if (currentCards[currentCardIndex]) {
        currentCards[currentCardIndex].classList.remove('focused');
      }

      currentRowIndex = newRowIndex;
      const targetRowCards = getCardsInCurrentRow();

      currentCardIndex = Math.max(0, Math.min(newCardIndex, targetRowCards.length - 1));

      const activeCard = targetRowCards[currentCardIndex];
      if (activeCard) {
        activeCard.classList.add('focused');
        activeCard.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
      }
    }

    function updateDetailBtnFocus(newIndex) {
      if (newIndex >= 0 && newIndex < detailBtns.length) {
        detailBtns[currentDetailBtnIndex].classList.remove('focused');
        currentDetailBtnIndex = newIndex;
        detailBtns[currentDetailBtnIndex].classList.add('focused');
      }
    }

    function updatePlayerBtnFocus(newIndex) {
      if (newIndex >= 0 && newIndex < playerBtns.length) {
        playerBtns[currentPlayerBtnIndex].classList.remove('focused');
        currentPlayerBtnIndex = newIndex;
        playerBtns[currentPlayerBtnIndex].classList.add('focused');
      }
    }

    function showPlayerControls() {
      playerControls.classList.add('visible');
      clearTimeout(controlsTimeout);
      controlsTimeout = setTimeout(() => { playerControls.classList.remove('visible'); }, 4000);
    }

    function openDetails(title, desc, videoUrl) {
      document.getElementById('showTitle').innerText = title;
      document.getElementById('showDesc').innerText = desc;
      selectedVideoUrl = videoUrl;
      activeZone = 'DETAILS';
      detailsScreen.style.display = 'flex';
      updateDetailBtnFocus(0);
    }

    function closeDetails() {
      activeZone = 'GRID';
      detailsScreen.style.display = 'none';
    }

    function startPlayback(url) {
      activeZone = 'PLAYER';
      playerScreen.style.display = 'block';
      videoPlayer.src = url;
      videoPlayer.play();
      updatePlayerBtnFocus(0);
      showPlayerControls();
    }

    function stopPlayback() {
      videoPlayer.pause();
      videoPlayer.src = '';
      playerScreen.style.display = 'none';
      detailsScreen.style.display = 'none';
      activeZone = 'GRID';
      clearTimeout(controlsTimeout);
    }

    videoPlayer.addEventListener('timeupdate', () => {
      if (videoPlayer.duration) {
        const percent = (videoPlayer.currentTime / videoPlayer.duration) * 100;
        progressBar.style.width = percent + '%';
      }
    });

    document.addEventListener('keydown', (e) => {
      const key = e.key;
      const keyCode = e.keyCode || e.which;

      const isUp = key === 'ArrowUp' || keyCode === 38;
      const isDown = key === 'ArrowDown' || keyCode === 40;
      const isLeft = key === 'ArrowLeft' || keyCode === 37;
      const isRight = key === 'ArrowRight' || keyCode === 39;
      const isEnter = key === 'Enter' || keyCode === 13;
      const isBack = key === 'Escape' || key === 'Backspace' || keyCode === 8 || keyCode === 27;

      if (isUp || isDown || isLeft || isRight || isEnter) {
        e.preventDefault();
      }

      if (activeZone === 'HERO') {
        if (isRight) updateHeroBtnFocus(1);
        if (isLeft) updateHeroBtnFocus(0);
        if (isDown) {
          heroBtns[currentHeroBtnIndex].classList.remove('focused');
          activeZone = 'GRID';
          updateCardFocus(0, 0);
        }
        if (isEnter) {
          if (currentHeroBtnIndex === 0) startPlayback(featuredVideoUrl);
          else openDetails(document.getElementById('heroTitle').innerText, document.getElementById('heroDesc').innerText, featuredVideoUrl);
        }
      }
      else if (activeZone === 'GRID') {
        const cards = getCardsInCurrentRow();

        if (isRight && currentCardIndex < cards.length - 1) {
          updateCardFocus(currentRowIndex, currentCardIndex + 1);
        }
        if (isLeft && currentCardIndex > 0) {
          updateCardFocus(currentRowIndex, currentCardIndex - 1);
        }
        if (isDown) {
          if (currentRowIndex < rows.length - 1) {
            updateCardFocus(currentRowIndex + 1, currentCardIndex);
          }
        }
        if (isUp) {
          if (currentRowIndex > 0) {
            updateCardFocus(currentRowIndex - 1, currentCardIndex);
          } else {
            cards[currentCardIndex].classList.remove('focused');
            activeZone = 'HERO';
            updateHeroBtnFocus(currentHeroBtnIndex);
          }
        }
        if (isEnter) {
          const card = cards[currentCardIndex];
          openDetails(card.getAttribute('data-title'), card.getAttribute('data-desc'), card.getAttribute('data-video'));
        }
      } 
      else if (activeZone === 'DETAILS') {
        if (isDown) updateDetailBtnFocus(1);
        if (isUp) updateDetailBtnFocus(0);
        if (isBack) closeDetails();
        if (isEnter) {
          if (currentDetailBtnIndex === 0) startPlayback(selectedVideoUrl);
          if (currentDetailBtnIndex === 1) closeDetails();
        }
      } 
      else if (activeZone === 'PLAYER') {
        if (!playerControls.classList.contains('visible')) {
          showPlayerControls();
          return;
        }

        showPlayerControls();

        if (isDown && currentPlayerBtnIndex === 0) updatePlayerBtnFocus(2);
        if (isUp && currentPlayerBtnIndex > 0) updatePlayerBtnFocus(0);
        if (isRight && currentPlayerBtnIndex > 0 && currentPlayerBtnIndex < 3) updatePlayerBtnFocus(currentPlayerBtnIndex + 1);
        if (isLeft && currentPlayerBtnIndex > 1) updatePlayerBtnFocus(currentPlayerBtnIndex - 1);

        if (isBack) stopPlayback();

        if (isEnter) {
          if (currentPlayerBtnIndex === 0) stopPlayback();
          if (currentPlayerBtnIndex === 1) videoPlayer.currentTime -= 10;
          if (currentPlayerBtnIndex === 2) {
            if (videoPlayer.paused) {
              videoPlayer.play();
              document.getElementById('pBtnPlayPause').innerText = '❚❚ Pause';
            } else {
              videoPlayer.pause();
              document.getElementById('pBtnPlayPause').innerText = '► Play';
            }
          }
          if (currentPlayerBtnIndex === 3) videoPlayer.currentTime += 10;
        }
      }
    });
  </script>
</body>
</html>
